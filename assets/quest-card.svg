<rect width="1200" height="360" rx="22" fill="url(#bg)"/>
<rect x="1" y="1" width="1198" height="358" rx="21" fill="none" stroke="#2a5169"/>

<text x="42" y="48" fill="#34e9ff" font-family="monospace" font-size="16" font-weight="700">&gt; ./current_quest</text>
<text x="1158" y="48" text-anchor="end" fill="#687f91" font-family="monospace" font-size="12">QUEST_ID: HELIOS_01</text>

<text x="42" y="92" fill="#f4f8ff" font-family="monospace" font-size="31" font-weight="800">EVOLVE HELIOS INTO A REAL GAME ENGINE</text>
<text x="42" y="119" fill="#9bb0bf" font-family="monospace" font-size="14">Not just a renderer. Not just a demo. A system people can build games with.</text>

